<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bachat Box – Coupon codes worldwide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=DM+Mono:wght@500&display=swap">
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#12213a;--mute:#5b6678;--line:#dde3ea;--brand:#0b7a75;--brand-ink:#fff;--sun:#ffb400;--sun-ink:#3a2a00;--bad:#c2412d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--card:#17202f;--ink:#eaf0f7;--mute:#9aa7ba;--line:#273247;--brand:#2bb5ad;--brand-ink:#06201e;--sun:#ffc533;--bad:#ff8a73;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1522;--card:#17202f;--ink:#eaf0f7;--mute:#9aa7ba;--line:#273247;--brand:#2bb5ad;--brand-ink:#06201e;--sun:#ffc533;--bad:#ff8a73;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:8px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;color:inherit;text-decoration:none}
.logo span{background:var(--sun);color:var(--sun-ink);padding:1px 8px;border-radius:6px;margin-left:4px}
.tools{display:flex;gap:8px}
.ghost,select.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{padding:28px 0 18px}
h1{font-size:clamp(30px,6vw,52px);line-height:1.05;letter-spacing:-.03em;margin:0 0 10px;font-weight:800;max-width:16ch}
.hero p{margin:0 0 20px;color:var(--mute);max-width:54ch}
.search{position:relative;max-width:620px}
.search input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
h2.sec{font-size:20px;margin:26px 0 12px;letter-spacing:-.01em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stores{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.store-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none}
.store-card:hover{border-color:var(--brand)}
.store-card b{font-size:16px}.store-card small{color:var(--mute)}
.logoc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;color:#12213a}
.note{background:var(--card);border:1px dashed var(--sun);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--mute);margin:8px 0}
.back{display:inline-block;margin:6px 0 14px;color:var(--brand);font-weight:600;text-decoration:none}
.shead{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.shead .logoc{width:72px;height:72px;font-size:32px}
.shead h1{font-size:clamp(26px,5vw,40px);margin:0}
.shead p{margin:2px 0 0;color:var(--mute)}
.list{display:grid;gap:14px;padding-bottom:40px}
.ticket{display:flex;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.stub{width:112px;flex:none;display:flex;align-items:center;justify-content:center;padding:12px 8px;text-align:center;border-right:2px dashed var(--line);background:var(--tint);color:#12213a}
.stub b{font-size:24px;line-height:1.1;letter-spacing:-.02em}
.main{flex:1;min-width:0;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.main h3{margin:0;font-size:18px;line-height:1.25}
.meta{font-size:13px;color:var(--mute)}.soon{color:var(--bad);font-weight:600}.ok{color:var(--brand);font-weight:600}
.actions{display:flex;gap:10px;align-items:center;padding-top:6px;flex-wrap:wrap}
.reveal{display:flex;border-radius:10px;overflow:hidden;border:2px solid var(--brand);min-width:200px;cursor:pointer;background:var(--card);font:inherit;padding:0;color:inherit}
.reveal .code{font-family:"DM Mono",ui-monospace,Menlo,monospace;letter-spacing:.06em;padding:9px 12px;flex:1;text-align:center}
.reveal .cta{background:var(--brand);color:var(--brand-ink);font-weight:600;padding:9px 14px;font-size:14px;white-space:nowrap}
.reveal[data-open="false"] .code{filter:blur(5px);user-select:none}
.reveal[data-open="false"] .cta::after{content:"Show code"}
.reveal[data-open="true"] .cta::after{content:"Copy"}
.reveal[data-copied="true"] .cta{background:var(--sun);color:var(--sun-ink)}
.reveal[data-copied="true"] .cta::after{content:"Copied"}
.votes{display:flex;gap:6px;font-size:13px;color:var(--mute);align-items:center}
.votes button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:4px 9px;font:inherit;font-size:13px;cursor:pointer}
.votes button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);font-weight:600}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--mute);font-size:13px}
@media (max-width:520px){.stub{width:86px}.stub b{font-size:19px}.reveal{min-width:0;width:100%}}
</style></head><body>
<div class="wrap">
<header class="top"><a class="logo" href="#">Bachat<span>Box</span></a>
<div class="tools"><select class="ghost" id="country" aria-label="Your country"></select><button class="ghost" id="themeBtn" aria-label="Switch light or dark theme">Theme</button></div></header>
<div id="app"></div>
<footer>Always check the final price at checkout. Codes can expire without notice.</footer>
</div>
<script>
var CN={PK:"Pakistan",IN:"India",AE:"UAE",SA:"Saudi Arabia",GB:"United Kingdom",US:"United States",CA:"Canada",AU:"Australia",DE:"Germany",BD:"Bangladesh"};
var TZ={"Asia/Karachi":"PK","Asia/Kolkata":"IN","Asia/Calcutta":"IN","Asia/Dubai":"AE","Asia/Riyadh":"SA","Europe/London":"GB","America/Toronto":"CA","America/Vancouver":"CA","Europe/Berlin":"DE","Asia/Dhaka":"BD"};
var CATS=["All","Shopping","Food","Fashion","Travel","Tech & Learning"];
var DAY=864e5,now=Date.now();
// store: id,name,cat,countries,tint,about,deals[title,code,days,used,badge]
function S(id,name,cat,c,tint,about,d){return{id:id,name:name,cat:cat,c:c,tint:tint,about:about,deals:d.map(function(x,i){return{id:id+i,title:x[0],code:x[1],days:x[2],used:x[3],badge:x[4],yes:Math.round(x[3]/9),no:Math.round(x[3]/70)}})}}
var ALL=["ALL"];
var STORES=[
S("daraz","Daraz","Shopping",["PK","BD"],"#fde8d6","Online marketplace for fashion, electronics and home.",[["Rs. 150 off your first wallet top-up","WALLET150",12,1840,"Rs 150"],["15% off home appliances","HOME15",7,1210,"15%"],["Free delivery on orders above Rs. 2,000","FREESHIP",20,860,"Free"]]),
S("foodpanda","Foodpanda","Food",["PK","BD"],"#fbdde7","Food and grocery delivery.",[["30% off your first two orders","NEWPANDA30",5,2310,"30%"],["Rs. 200 off orders above Rs. 1,500","PANDA200",14,990,"Rs 200"],["Free delivery on weekends","WKND",3,640,"Free"]]),
S("khaadi","Khaadi","Fashion",["PK"],"#e7e1f7","Lawn, unstitched and ready-to-wear.",[["20% off lawn and unstitched","LAWN20",21,960,"20%"],["Extra 10% on sale items","SALE10",9,520,"10%"]]),
S("careem","Careem","Travel",["PK","AE","SA"],"#dff3e4","Rides, food and payments.",[["Rs. 300 off your next two rides","RIDE300",2,1420,"Rs 300"],["25% off your first Careem Food order","CFOOD25",10,780,"25%"]]),
S("flipkart","Flipkart","Shopping",["IN"],"#e1ecfb","India's marketplace for mobiles and fashion.",[["₹200 off on orders above ₹1,500","FLIP200",8,2100,"₹200"],["10% off with partner cards","CARD10",15,1330,"10%"]]),
S("swiggy","Swiggy","Food",["IN"],"#ffe5d2","Food delivery and Instamart.",[["50% off up to ₹100 on first order","SWIG50",6,3010,"50%"],["Free delivery above ₹199","FREEDEL",18,1500,"Free"]]),
S("noon","Noon","Shopping",["AE","SA"],"#fff1c9","Shopping across the Gulf.",[["AED 50 off orders above AED 300","NOON50",11,1750,"AED 50"],["15% off beauty and fragrance","GLOW15",4,980,"15%"]]),
S("asos","ASOS","Fashion",["GB","US","DE","AU"],"#e9e9e9","Fashion for every day.",[["20% off full-price items","ASOS20",7,2800,"20%"],["Free next-day delivery over £40","NEXTDAY",25,1200,"Free"]]),
S("deliveroo","Deliveroo","Food",["GB","AE","AU"],"#d9f1f4","Restaurant delivery.",[["£8 off your first order","DELI8",9,1900,"£8"],["Free delivery for 7 days","FREE7",5,870,"Free"]]),
S("walmart","Walmart","Shopping",["US","CA"],"#e1ecfb","Everyday low prices.",[["$10 off first delivery order","WMT10",13,3300,"$10"],["Free shipping over $35","SHIP35",30,2250,"Free"]]),
S("target","Target","Shopping",["US"],"#fbdcdc","Home, clothing and groceries.",[["20% off your first Target Circle order","CIRCLE20",10,2600,"20%"],["$15 off $75 in home decor","HOME15",6,1100,"$15"]]),
S("doordash","DoorDash","Food",["US","CA","AU"],"#fbdcdc","Food delivery.",[["$0 delivery on your first order","DASH0",8,3400,"Free"],["25% off orders above $25","DASH25",3,1350,"25%"]]),
S("booking","Booking.com","Travel",ALL,"#dbe7fb","Hotels and stays worldwide.",[["10% off your next stay","STAY10",30,5200,"10%"],["Extra 5% for app bookings","APP5",14,2100,"5%"]]),
S("airbnb","Airbnb","Travel",ALL,"#fde0e4","Homes and experiences.",[["$30 off your first booking","FIRST30",20,4100,"$30"],["10% off a stay of 7+ nights","WEEK10",12,1450,"10%"]]),
S("nike","Nike","Fashion",ALL,"#ececec","Shoes and sportswear.",[["20% off your first order","NIKE20",16,6100,"20%"],["Free shipping for members","MEMBER",40,3900,"Free"]]),
S("udemy","Udemy","Tech & Learning",ALL,"#ecdff8","Online courses.",[["Courses from $9.99 this week","LEARN10",4,4800,"$9.99"],["Extra 15% on bundles","BUNDLE15",9,1050,"15%"]])
];
var cc=null,cat="All",q="",mine={};
try{mine=JSON.parse(localStorage.getItem("bb-v")||"{}");cc=localStorage.getItem("bb-c")}catch(e){}
function detect(){var tz="";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(e){}
 if(TZ[tz])return TZ[tz];
 var m=(navigator.language||"").split("-")[1];if(m&&CN[m.toUpperCase()])return m.toUpperCase();
 if(tz.indexOf("America/")===0)return"US";if(tz.indexOf("Australia/")===0)return"AU";if(tz.indexOf("Europe/")===0)return"GB";return"US"}
if(!cc||!CN[cc])cc=detect();
function flag(c){return String.fromCodePoint.apply(null,c.split("").map(function(x){return 127397+x.charCodeAt(0)}))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var $=function(s){return document.querySelector(s)};
function local(s){return s.c[0]==="ALL"||s.c.indexOf(cc)>-1}
function card(s){return '<a class="store-card" href="#store-'+s.id+'"><div class="logoc" style="background:'+s.tint+'">'+esc(s.name[0])+'</div><b>'+esc(s.name)+'</b><small>'+s.deals.length+' codes</small></a>'}
function home(){
 var t=q.toLowerCase(),inCat=function(s){return cat==="All"||s.cat===cat};
 var hits=STORES.filter(function(s){return inCat(s)&&(!t||(s.name+" "+s.about+" "+s.deals.map(function(d){return d.title}).join(" ")).toLowerCase().indexOf(t)>-1)});
 var loc=hits.filter(function(s){return s.c[0]!=="ALL"&&s.c.indexOf(cc)>-1}),gl=hits.filter(function(s){return s.c[0]==="ALL"}),oth=hits.filter(function(s){return loc.indexOf(s)<0&&gl.indexOf(s)<0});
 var h='<section class="hero"><h1>Coupon codes for every store, anywhere.</h1><p>Pick a store, tap a deal and the code is yours. We show stores near you first.</p><div class="search"><input id="q" type="search" value="'+esc(q)+'" placeholder="Search any store or deal…" aria-label="Search stores or deals"></div><div class="chips">'+CATS.map(function(c){return'<button class="chip" aria-pressed="'+(c===cat)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("")+'</div></section><div class="note">Sample data: codes are placeholders for the demo. Replace with real, verified codes before launch.</div>';
 if(!hits.length)return h+'<div class="empty">No store matches “'+esc(q)+'”. Try a different name or category.</div>';
 if(loc.length)h+='<h2 class="sec">Popular in '+flag(cc)+' '+CN[cc]+'</h2><div class="stores">'+loc.map(card).join("")+'</div>';
 if(gl.length)h+='<h2 class="sec">Worldwide stores</h2><div class="stores">'+gl.map(card).join("")+'</div>';
 if(oth.length)h+='<h2 class="sec">Other countries</h2><div class="stores">'+oth.map(card).join("")+'</div>';
 return h}
function ticket(d,tint){var v=mine[d.id],p=Math.round(100*d.yes/Math.max(1,d.yes+d.no));
 var w=d.days<=3?'<span class="soon">Ends in '+d.days+(d.days===1?" day":" days")+'</span>':"Expires "+new Date(now+d.days*DAY).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
 return '<article class="ticket"><div class="stub" style="--tint:'+tint+'"><b>'+esc(d.badge)+'<br>off</b></div><div class="main"><h3>'+esc(d.title)+'</h3><div class="meta"><span class="ok">Verified</span> · '+w+' · '+d.used.toLocaleString()+' used · '+p+'% say it works</div><div class="actions"><button class="reveal" data-open="false" aria-label="Show code"><span class="code">'+esc(d.code)+'</span><span class="cta"></span></button><div class="votes">Worked?<button data-v="yes" data-id="'+d.id+'" aria-pressed="'+(v==="yes")+'">Yes</button><button data-v="no" data-id="'+d.id+'" aria-pressed="'+(v==="no")+'">No</button></div></div></div></article>'}
function storePage(s){
 var ds=s.deals.slice().sort(function(a,b){return b.used-a.used});
 return '<a class="back" href="#">← All stores</a><div class="shead"><div class="logoc" style="background:'+s.tint+'">'+esc(s.name[0])+'</div><div><h1>'+esc(s.name)+' coupon codes</h1><p>'+esc(s.about)+' '+ds.length+' working codes · '+(s.c[0]==="ALL"?"Worldwide":s.c.map(function(c){return CN[c]}).join(", "))+'</p></div></div><div class="note">Sample data for the demo.</div><div class="list">'+ds.map(function(d){return ticket(d,s.tint)}).join("")+'</div>'}
function render(){
 var m=location.hash.match(/^#store-([a-z0-9-]+)$/),s=m&&STORES.filter(function(x){return x.id===m[1]})[0];
 $("#app").innerHTML=s?storePage(s):home();
 document.title=s?s.name+" coupon codes – Bachat Box":"Bachat Box – Coupon codes worldwide";
 if(!s&&q){var i=$("#q");i.focus();i.setSelectionRange(q.length,q.length)}
 if(s)window.scrollTo(0,0)}
$("#country").innerHTML=Object.keys(CN).map(function(c){return'<option value="'+c+'"'+(c===cc?" selected":"")+'>'+flag(c)+' '+CN[c]+'</option>'}).join("");
$("#country").onchange=function(e){cc=e.target.value;try{localStorage.setItem("bb-c",cc)}catch(x){}render()};
$("#app").addEventListener("input",function(e){if(e.target.id==="q"){q=e.target.value;render()}});
$("#app").addEventListener("click",function(e){
 var c=e.target.closest(".chip");if(c){cat=c.dataset.c;render();return}
 var r=e.target.closest(".reveal");
 if(r){if(r.dataset.open==="false"){r.dataset.open="true";r.setAttribute("aria-label","Copy code");return}
  var t=r.querySelector(".code").textContent,done=function(){r.dataset.copied="true";setTimeout(function(){r.dataset.copied="false"},1600)};
  try{navigator.clipboard.writeText(t).then(done,done)}catch(x){done()}return}
 var v=e.target.closest("[data-v]");
 if(v){var id=v.dataset.id;if(mine[id]===v.dataset.v)delete mine[id];else mine[id]=v.dataset.v;try{localStorage.setItem("bb-v",JSON.stringify(mine))}catch(x){}
  var y=window.scrollY;render();window.scrollTo(0,y)}});
$("#themeBtn").onclick=function(){var r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
window.addEventListener("hashchange",render);render();
</script></body></html>
